name: Generate Snake Game

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%233776AB&color_dots=%23ebedf0,%23c9e2f5,%238ec5ea,%234b8bbe,%23ffd43b
            dist/github-snake-dark.svg?color_snake=%23ffd43b&color_dots=%23161b22,%23264a6d,%23306998,%234b8bbe,%23ffd43b
      - name: Upload Snake Animation
        uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
